name: Check alternate public CPU model
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned CPU inference runtime
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          python -m pip install -r requirements-intelligence.txt
          python -m pip install -r requirements-local-ai.txt
      - uses: actions/cache/restore@v6.1.0
        id: weights
        with:
          path: ~/.cache/huggingface/hub
          key: realworth-qwen25-7b-gguf-q4km-v1
      - name: Test actual public articles with an alternate model
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          python -u - <<'PY'
          import sys,json,os
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'scripts')
          import build_intelligence as m
          payload,_=m.build(json.load(open('docs/data/research.json')),{},'local',2,datetime.now(timezone.utc))
          m.write_atomic(payload,m.OUTPUT)
          print('ACTUAL_MODEL_RESULT',json.dumps(payload['meta']),flush=True)
          raise SystemExit(0 if payload['meta']['ai_interpretations'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alternate-model-derived-evidence
          path: docs/data/intelligence.json
          retention-days: 1
      - uses: actions/cache/save@v6.1.0
        continue-on-error: true
        if: ${{ always() && steps.weights.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/huggingface/hub
          key: realworth-qwen25-7b-gguf-q4km-v1
