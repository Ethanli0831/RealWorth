name: Publish website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages-setup
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enable main /docs GitHub Pages if needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/pages" > /dev/null 2> /tmp/pages-status-error; then
            echo 'GitHub Pages is already enabled.'
          elif grep -q 'HTTP 404' /tmp/pages-status-error; then
            printf '%s' '{"source":{"branch":"main","path":"/docs"},"build_type":"legacy"}' > /tmp/pages-config.json
            if gh api --method POST "repos/$REPOSITORY/pages" \
              --input /tmp/pages-config.json --jq '.html_url' > /tmp/pages-create.log 2>&1; then
              cat /tmp/pages-create.log
            else
              python3 -c 'from pathlib import Path; message=Path("/tmp/pages-create.log").read_text(); print("::error::"+message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
              exit 1
            fi
          else
            cat /tmp/pages-status-error >&2
            exit 1
          fi

      - name: Request website build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/$REPOSITORY/pages/builds" --jq '.status'
