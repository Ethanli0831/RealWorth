name: Publish website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages-setup
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enable main /docs GitHub Pages if needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/pages" > /dev/null 2> /tmp/pages-status-error; then
            echo 'GitHub Pages is already enabled.'
          elif rg -q 'HTTP 404' /tmp/pages-status-error; then
            gh api --method POST "repos/$REPOSITORY/pages" \
              -f 'source[branch]=main' -f 'source[path]=/docs' \
              -f 'build_type=legacy' --jq '.html_url'
          else
            cat /tmp/pages-status-error >&2
            exit 1
          fi

      - name: Request website build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/$REPOSITORY/pages/builds" --jq '.status'
